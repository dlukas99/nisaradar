# Izvoz podataka za web (iz data/snapshot) + build Vite aplikacije + objava na GitHub Pages.
# Pokreće se na push u main, ručno, ili ga poziva noćni workflow nakon osvježavanja podataka.
name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/snapshot/**", "data/reference/**", "pipeline/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ref: main, da poziv iz noćnog workflowa uzme upravo commitane podatke.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Izvoz JSON-a za web
        run: |
          pip install pandas pyarrow numpy requests
          python -X utf8 pipeline/export.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build weba
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
